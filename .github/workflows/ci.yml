name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Publish (win-x64)
      run: dotnet publish src/AppWatchdog.App/AppWatchdog.App.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o dist

    - name: Copy config example
      run: |
        mkdir dist\config
        copy config\appsettings.example.json dist\config\appsettings.example.json

    - name: Upload artifact (temporary)
      uses: actions/upload-artifact@v4
      with:
        name: AppWatchdog-win-x64
        path: dist/
        retention-days: 7
